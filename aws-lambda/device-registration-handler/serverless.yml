service: lc-platform-device-registration

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  memorySize: 256
  timeout: 15
  environment:
    DATABASE_URL: ${env:DATABASE_URL, 'postgresql://postgres:<DB_PASSWORD>@<DB_HOST>:5432/lc_platform?schema=public'}

functions:
  registerDevice:
    handler: index.handler
    events:
      # Triggered automatically on AWS IoT Thing creation
      - iot:
          sql: "SELECT * FROM '$aws/events/thing/+/created'"
      # Optional HTTP REST Endpoint
      - httpApi:
          path: /devices/register
          method: post

package:
  patterns:
    - '!test-local.js'
    - '!*.bat'
    - '!*.sh'
    - '!README.md'
    - 'index.js'
    - 'package.json'
    - 'node_modules/**'
